# DEM HITS — Render Blueprint (free tier to start, $0)
# Free web services have no persistent disk: the SQLite DB and uploaded
# audio reset on redeploy/restart. Before advertising, move to a paid
# plan + persistent disk mounted at DATA_DIR (or object storage) — the
# app already reads DATA_DIR from env, so no code change is needed.
services:
  - type: web
    name: dem-hits
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ADMIN_PIN
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: BASE_URL
        sync: false
      - key: DATA_DIR
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
